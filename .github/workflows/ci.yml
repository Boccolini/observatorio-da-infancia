name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile-check
        run: python -m compileall -q src extract.py scripts
      - name: End-to-end on sample data
        run: python extract.py --sample
      - name: Verify outputs
        run: |
          test -f output/gastroenterite_A09_menores_5_anos.xlsx
          test -d output/graphs
          test "$(ls output/graphs | wc -l)" -gt 0
